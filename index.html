<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VR — Поиск по ID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Social preview -->
    <meta property="og:title" content="VR — Поиск по ID">
    <meta property="og:description" content="Мини-приложение для поиска скриншотов игроков по ID">
    <meta property="og:image" content="icon-512.png">
    <meta property="og:type" content="website">

    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 10px;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin: 0 0 8px 0;
            cursor: default;
            user-select: none;
        }

        .calc {
            max-width: 420px;
            margin: auto;
            background: #020617;
            padding: 16px; /* Одинаковый отступ 16px со всех четырех сторон */
            border-radius: 12px;
            box-sizing: border-box;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin: 0 0 0px 0; /* Оставили отступ только снизу, чтобы отделить от картинки */
            align-items: stretch;
            justify-content: center;
            flex-wrap: nowrap;
        }

        #idInput {
            flex: 6; /* Занимает 6 частей пространства */
            min-width: 0;
            padding: 12px 14px;
            font-size: 17px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        #searchBtn {
            flex: 4; /* Занимает 4 части пространства (чуть меньше поля) */
            padding: 0;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            box-sizing: border-box;
        }

        #searchBtn:active {
            background: #2563eb;
        }

        #result {
            text-align: center;
            margin-top: 0;      /* Убираем лишний внешний отступ сверху */
	    padding: 0; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;          /* Это создаст одинаковые зазоры между картинкой и кнопкой */
                }

        #screenshot {
            width: 100%;
            display: none;
            margin-top: 10px;   /* Гарантируем отсутствие отступа сверху */
            border-radius: 8px;
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        #notFound {
            color: #f87171;
            font-size: 17px;
            margin-top: 16px;
            display: none;
        }

        /* КНОПКА ПОДЕЛИТЬСЯ */
        #shareBtn {
	    margin-top: 14px;
            padding: 12px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #22c55e;
            color: #020617;
            cursor: pointer;
            display: none;
        }

        #shareBtn:active {
            background: #16a34a;
        }

        @media (min-width: 421px) {
            .calc {
                padding: 10px 15px;
                max-width: 460px;
            }

            #searchBtn {
                padding: 0 28px;
                min-width: 90px;
            }

            	.input-row {
            display: flex;
            gap: 12px;           /* Фиксированный зазор между элементами */
            margin: 16px 0 24px 0;
            align-items: stretch;
            justify-content: center; /* Центрирует содержимое, если есть лишнее место */
            flex-wrap: nowrap;
        }
        }

        @media (max-width: 360px) {
            #searchBtn {
                padding: 0 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<h1>VR — Поиск по ID</h1>

<div class="calc">
    <div class="input-row">
        <input id="idInput" type="number" inputmode="numeric" placeholder="Введите ID" autocomplete="off">
        <button id="searchBtn">Поиск</button>
    </div>

    <div id="result">
        <img id="screenshot" alt="Скриншот игрока">
        <div id="notFound">ID не найден</div>
        <button id="shareBtn">Поделиться в Telegram</button>
    </div>
</div>

<script>
    const input = document.getElementById('idInput');
    const btn = document.getElementById('searchBtn');
    const img = document.getElementById('screenshot');
    const notFound = document.getElementById('notFound');
    const shareBtn = document.getElementById('shareBtn');

    btn.addEventListener('click', search);
    input.addEventListener('keypress', e => {
        if (e.key === 'Enter') search();
    });

    function search() {
        const id = input.value.trim();
        if (!id) return;

        img.style.display = 'none';
        notFound.style.display = 'none';
        shareBtn.style.display = 'none';

        const url = `./${id}.webp`;

        const testImg = new Image();
        testImg.onload = () => {
            img.src = url;
            img.style.display = 'block';
            shareBtn.style.display = 'inline-block';

            shareBtn.onclick = () => {
                const tgUrl =
                    `https://t.me/share/url?` +
                    `url=${encodeURIComponent(location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + id + '.webp')}` +
                    `&text=${encodeURIComponent('VR — скриншот игрока ID: ' + id)}`;

                window.open(tgUrl, '_blank');
            };
        };

        testImg.onerror = () => {
            notFound.style.display = 'block';
        };

        testImg.src = url;
    }
</script>

</body>
</html>
