<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VR — Поиск по ID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">

    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        /* ЭКРАН ПАРОЛЯ */
        #authScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 56px; 
            box-sizing: border-box;
        }

        #passInput {
            width: 100%;
            max-width: 280px;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #1e293b;
            background: #020617;
            color: white;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            outline: none;
        }

        #passBtn {
            width: 100%;
            max-width: 280px;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
        }

        #passError {
            color: #f87171;
            margin-top: 15px;
            display: none;
            font-size: 15px;
        }

        /* ГЛАВНЫЙ КОНТЕНТ */
        h1 {
            text-align: center;
            font-size: 22px;
            margin: 0 0 16px 0; 
            line-height: 1.2;
        }

        .calc {
            max-width: 420px;
            margin: auto;
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 16px 0 24px 0;
            align-items: stretch;
        }

        /* УМЕНЬШЕННОЕ ПОЛЕ ВВОДА */
        #idInput {
            width: 60%; /* Поле занимает 60% ширины, чтобы кнопка влезла */
            padding: 12px 14px;
            font-size: 17px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        #searchBtn {
            flex: 1; /* Кнопка занимает остаток места */
            padding: 0 15px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        #result { text-align: center; margin-top: 12px; }

        #screenshot {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
            margin: 0 auto;
        }

        #notFound { color: #f87171; font-size: 17px; margin-top: 16px; display: none; }

        #shareBtn {
            margin-top: 14px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #22c55e;
            color: #020617;
            cursor: pointer;
            display: none;
            width: 100%;
        }

        @media (min-width: 421px) {
            .calc { padding: 24px 30px; max-width: 460px; }
            #authScreen { padding-top: 60px; }
        }
    </style>
</head>
<body>

<div id="authScreen">
    <input type="tel" id="passInput" placeholder="Введите пароль" autocomplete="off">
    <button id="passBtn">Войти</button>
    <div id="passError">Неверный пароль</div>
</div>

<h1>VR — Поиск по ID</h1>

<div class="calc">
    <div class="input-row">
        <input id="idInput" type="text" placeholder="Введите ID" autocomplete="off">
        <button id="searchBtn">Поиск</button>
    </div>

    <div id="result">
        <img id="screenshot" alt="Скриншот игрока">
        <div id="notFound">ID не найден</div>
        <button id="shareBtn">Поделиться в Telegram</button>
    </div>
</div>

<script>
    // 1. АВТОРИЗАЦИЯ
    const authScreen = document.getElementById('authScreen');
    const passInput = document.getElementById('passInput');
    const passBtn = document.getElementById('passBtn');
    const passError = document.getElementById('passError');
    const CORRECT_PASSWORD = "4081";

    function checkPass() {
        if (passInput.value === CORRECT_PASSWORD) {
            authScreen.style.display = 'none';
        } else {
            passError.style.display = 'block';
            passInput.value = '';
        }
    }
    passBtn.addEventListener('click', checkPass);
    passInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkPass(); });

    // 2. ПОИСК (ВАШ ОРИГИНАЛЬНЫЙ КОД)
    const input = document.getElementById('idInput');
    const btn = document.getElementById('searchBtn');
    const img = document.getElementById('screenshot');
    const notFound = document.getElementById('notFound');
    const shareBtn = document.getElementById('shareBtn');

    btn.addEventListener('click', search);
    input.addEventListener('keypress', e => {
        if (e.key === 'Enter') search();
    });

    function search() {
        const id = input.value.trim();
        if (!id) return;

        img.style.display = 'none';
        notFound.style.display = 'none';
        shareBtn.style.display = 'none';

        const url = `./${id}.webp`;

        const testImg = new Image();
        testImg.onload = () => {
            img.src = url;
            img.style.display = 'block';
            shareBtn.style.display = 'inline-block';

            shareBtn.onclick = () => {
                const tgUrl =
                    `https://t.me?` +
                    `url=${encodeURIComponent(location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + id + '.webp')}` +
                    `&text=${encodeURIComponent('VR — скриншот игрока ID: ' + id)}`;

                window.open(tgUrl, '_blank');
            };
        };

        testImg.onerror = () => {
            notFound.style.display = 'block';
        };

        testImg.src = url;
    }
</script>

</body>
</html>
