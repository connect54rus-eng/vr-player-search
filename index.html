<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VR — Поиск по ID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta property="og:title" content="VR — Поиск по ID">
    <meta property="og:description" content="Мини-приложение для поиска скриншотов игроков по ID">
    <meta property="og:image" content="icon-512.png">
    <meta property="og:type" content="website">

    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin: 0 0 16px 0;
            cursor: default;
            user-select: none;
        }

        .calc {
            max-width: 420px;
            margin: auto;
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 16px 0 24px 0;
            align-items: stretch;
            flex-wrap: nowrap;
        }

        #idInput {
            flex: 1 1 auto;
            min-width: 0;
            padding: 12px 14px;
            font-size: 17px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        #searchBtn {
            padding: 0 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        #searchBtn:active {
            background: #2563eb;
        }

        #result {
            text-align: center;
            margin-top: 12px;
        }

        #screenshot {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }

        #notFound {
            color: #f87171;
            font-size: 17px;
            margin-top: 16px;
            display: none;
        }

        @media (min-width: 421px) {
            .calc {
                padding: 24px 30px;
                max-width: 460px;
            }
            #searchBtn { padding: 0 28px; min-width: 90px; }
            .input-row { gap: 12px; }
        }

        @media (max-width: 360px) {
            #searchBtn { padding: 0 16px; font-size: 16px; }
        }

        /* Стили для пароля */
        #passwordOverlay {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            z-index:1000;
        }
        #passwordOverlay input {
            padding:10px;
            font-size:16px;
            border-radius:8px;
            border:none;
            margin-bottom:8px;
        }
        #passwordOverlay button {
            padding:6px 16px;
            font-size:16px;
            border-radius:8px;
            border:none;
            background:#3b82f6;
            color:white;
            cursor:pointer;
        }
        #passwordError {
            color:#f87171;
            margin-top:8px;
            display:none;
        }
    </style>
</head>
<body>

<!-- Окно для пароля -->
<div id="passwordOverlay">
    <h2>Введите пароль</h2>
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button id="passwordBtn">Войти</button>
    <div id="passwordError">Неверный пароль</div>
</div>

<h1>VR — Поиск по ID</h1>

<div class="calc">
    <div class="input-row">
        <input id="idInput" type="text" placeholder="Введите ID" autocomplete="off">
        <button id="searchBtn">Поиск</button>
    </div>

    <div id="result">
        <img id="screenshot" alt="Скриншот игрока">
        <div id="notFound">ID не найден</div>
    </div>
</div>

<script>
const overlay = document.getElementById('passwordOverlay');
const passInput = document.getElementById('passwordInput');
const passBtn = document.getElementById('passwordBtn');
const passError = document.getElementById('passwordError');

const PASSWORD = "+rM&_2*rt~N!";

passBtn.addEventListener('click', checkPassword);
passInput.addEventListener('keypress', e => { if(e.key==='Enter') checkPassword(); });

function checkPassword() {
    if(passInput.value === PASSWORD){
        overlay.style.display = 'none';
    } else {
        passError.style.display = 'block';
    }
}

// Код поиска по ID
const input = document.getElementById('idInput');
const btn   = document.getElementById('searchBtn');
const img   = document.getElementById('screenshot');
const notFound = document.getElementById('notFound');

btn.addEventListener('click', search);
input.addEventListener('keypress', e => { if(e.key==='Enter') search(); });

function search() {
    let id = input.value.trim();
    if (!id) return;
    img.style.display = 'none';
    notFound.style.display = 'none';
    const url = `./${id}.webp`;
    const testImg = new Image();
    testImg.onload = () => { img.src = url; img.style.display='block'; };
    testImg.onerror = () => { notFound.style.display='block'; };
    testImg.src = url;
}
</script>

</body>
</html>
