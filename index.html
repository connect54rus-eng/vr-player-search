<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VR — Поиск по ID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">

    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin: 0 0 16px 0;
            cursor: default;
            user-select: none;
        }

        .calc {
            max-width: 350px; /* компактнее */
            margin: auto;
            background: #010414; /* чуть темнее */
            padding: 16px; /* меньше padding */
            border-radius: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 16px 0 24px 0;
        }

        /* Поле ввода ID уже в 2 раза */
        #idInput {
            flex: 0 0 50%; /* 50% ширины */
            padding: 12px;
            font-size: 17px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
        }

        /* Кнопка Поиск - оставляем как раньше */
        #searchBtn {
            padding: 0 24px; /* как в исходном коде */
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        #searchBtn:active {
            background: #2563eb;
        }

        #result {
            text-align: center;
            margin-top: 12px;
        }

        #screenshot {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }

        #notFound {
            color: #f87171;
            font-size: 17px;
            margin-top: 16px;
            display: none;
        }

        /* Адаптив для узких экранов */
        @media (max-width: 360px) {
            .input-row {
                flex-direction: column;
            }

            #idInput, #searchBtn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

<h1>VR — Поиск по ID</h1>

<div class="calc">
    <div class="input-row">
        <input id="idInput" type="text" placeholder="Введите ID" autocomplete="off">
        <button id="searchBtn">Поиск</button>
    </div>

    <div id="result">
        <img id="screenshot" alt="Скриншот игрока">
        <div id="notFound">ID не найден</div>
    </div>
</div>

<script>
    const input = document.getElementById('idInput');
    const btn   = document.getElementById('searchBtn');
    const img   = document.getElementById('screenshot');
    const notFound = document.getElementById('notFound');

    btn.addEventListener('click', search);
    input.addEventListener('keypress', e => {
        if (e.key === 'Enter') search();
    });

    function search() {
        let id = input.value.trim();
        if (!id) return;

        img.style.display = 'none';
        notFound.style.display = 'none';

        const url = `./${id}.webp`;

        const testImg = new Image();
        testImg.onload = () => {
            img.src = url;
            img.style.display = 'block';
        };
        testImg.onerror = () => {
            notFound.style.display = 'block';
        };
        testImg.src = url;
    }
</script>

</body>
</html>
